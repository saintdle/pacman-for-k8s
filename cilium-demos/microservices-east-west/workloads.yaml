apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-web
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: pacman-cilium-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pacman
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: pacman-cilium-demo
    spec:
      serviceAccountName: pacman-demo
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman@sha256:cb9272461127465676fefd4778e67faea41ef65e03c19014626287d2c542dd05
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ROLE
              value: web
            - name: APP_VERSION
              value: v1
            - name: APP_VARIANT
              value: stable
            - name: SCORE_SERVICE_URL
              value: http://pacman-score:8080
            - name: USER_SERVICE_URL
              value: http://pacman-user:8080
            - name: DB_TYPE
              value: memory
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
---
