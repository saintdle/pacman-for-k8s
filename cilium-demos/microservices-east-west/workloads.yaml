---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacman-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pacman-location-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pacman-location-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pacman-location-reader
subjects:
  - kind: ServiceAccount
    name: pacman-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pacman-demo-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pacman-demo-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pacman-demo-node-reader
subjects:
  - kind: ServiceAccount
    name: pacman-demo
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-web
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-score
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: score
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: score
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-user
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: user
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: user
  ports:
    - name: http
      port: 8080
      targetPort: http
