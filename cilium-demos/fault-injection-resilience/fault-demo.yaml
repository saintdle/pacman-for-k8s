apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-fault-demo
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: pacman-cilium-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pacman
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: pacman-cilium-demo
    spec:
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman@sha256:4de4f422b5edb49b606055525c5dc29c3824446f401f6ece241d7ae6302d1fca
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: fault-demo
            - name: APP_VARIANT
              value: resilience
            - name: DB_TYPE
              value: memory
            - name: DEMO_SECURITY_MODE
              value: "true"
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pacman-demo-token
                  key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: pacman-demo-token
type: Opaque
stringData:
  token: pacman-demo
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-fault-demo
spec:
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
