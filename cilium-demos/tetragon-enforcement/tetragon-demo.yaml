apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-tetragon-demo
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: pacman-cilium-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pacman
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: pacman-cilium-demo
    spec:
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman@sha256:2a55f4d74bc05dea3ae05912fbdcbe9348f9aafb752902054a7f066cfa112f68
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          env:
            - name: APP_VERSION
              value: tetragon-demo
            - name: APP_VARIANT
              value: runtime-security
            - name: DB_TYPE
              value: memory
            - name: DEMO_SECURITY_MODE
              value: "true"
            - name: DEMO_TOKEN
              value: pacman-demo
            - name: DEMO_FILE_PROBE_ENABLED
              value: "true"
            - name: DEMO_EXEC_PROBE_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-tetragon-demo
spec:
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
