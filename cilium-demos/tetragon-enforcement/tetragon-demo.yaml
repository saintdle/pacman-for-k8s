apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-tetragon-demo
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: pacman-cilium-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pacman
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: pacman-cilium-demo
    spec:
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman@sha256:599587789e3d8192dd2b283683ca692d154318c7d6690f7ba3dd26a5f2142987
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: tetragon-demo
            - name: APP_VARIANT
              value: runtime-security
            - name: DB_TYPE
              value: memory
            - name: DEMO_SECURITY_MODE
              value: "true"
            - name: DEMO_TOKEN
              value: pacman-demo
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-tetragon-demo
spec:
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
