apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-stable
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
    app.kubernetes.io/version: stable
    app.kubernetes.io/part-of: pacman-cilium-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pacman
      app.kubernetes.io/version: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: web
        app.kubernetes.io/version: stable
        app.kubernetes.io/part-of: pacman-cilium-demo
    spec:
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman@sha256:d1c36678cd8cb7c4a0ea7c80f8161ec39c899da20c4328d0dc4ff21ada762198
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: stable
            - name: APP_VARIANT
              value: classic
            - name: APP_COLOR
              value: "#ffcc00"
            - name: DB_TYPE
              value: memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-canary
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
    app.kubernetes.io/version: canary
    app.kubernetes.io/part-of: pacman-cilium-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pacman
      app.kubernetes.io/version: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: web
        app.kubernetes.io/version: canary
        app.kubernetes.io/part-of: pacman-cilium-demo
    spec:
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman@sha256:d1c36678cd8cb7c4a0ea7c80f8161ec39c899da20c4328d0dc4ff21ada762198
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: canary
            - name: APP_VARIANT
              value: ebee
            - name: APP_COLOR
              value: "#66ccff"
            - name: EBEE_MODE
              value: "true"
            - name: ALLOW_CLIENT_EBEE_MODE_OVERRIDE
              value: "false"
            - name: DB_TYPE
              value: memory
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-stable
spec:
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/version: stable
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-canary
spec:
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/version: canary
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pacman-gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pacman-canary
spec:
  parentRefs:
    - name: pacman-gateway
  rules:
    - backendRefs:
        - name: pacman-stable
          port: 8080
          weight: 80
        - name: pacman-canary
          port: 8080
          weight: 20
