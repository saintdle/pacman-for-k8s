apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-topology
  labels:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: pacman-cilium-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: pacman
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacman
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: pacman-cilium-demo
    spec:
      serviceAccountName: pacman-topology
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pacman
              app.kubernetes.io/component: web
      containers:
        - name: pacman
          image: docker.io/saintdle/pacman@sha256:d1c36678cd8cb7c4a0ea7c80f8161ec39c899da20c4328d0dc4ff21ada762198
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ROLE
              value: web
            - name: APP_VERSION
              value: topology
            - name: APP_VARIANT
              value: topology-aware
            - name: DB_TYPE
              value: memory
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacman-topology
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pacman-topology-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pacman-topology-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pacman-topology-reader
subjects:
  - kind: ServiceAccount
    name: pacman-topology
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pacman-topology-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pacman-topology-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pacman-topology-node-reader
subjects:
  - kind: ServiceAccount
    name: pacman-topology
---
apiVersion: v1
kind: Service
metadata:
  name: pacman-topology
  labels:
    app.kubernetes.io/name: pacman
  annotations:
    service.kubernetes.io/topology-mode: Auto
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
