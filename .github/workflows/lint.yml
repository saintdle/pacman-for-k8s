name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native-bpf-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Run native BPF CPU-only regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'native_bpf_*_test.py'

  promotion-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ripgrep for the promotion guard regression
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install yq for structured manifest conformance
        run: |
          curl --fail --silent --show-error --location https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 --output /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version
      - name: Check promotion and consumer references
        run: |
          node --test tests/pacman-promotion.test.mjs
          node tools/pacman-promotion.mjs check-references

  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run offline raw-manifest and Helm lifecycle regressions
        run: |
          bash tests/lifecycle.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'pacman_helm_uninstall_test.py'

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: 'yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable, comments: disable, indentation: disable}}" .'

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate core manifests against Kubernetes 1.30
        run: |
          # Render RBAC template before validating.
          export NAMESPACE=pacman-demo
          envsubst < security/rbac.yaml > /tmp/rendered-rbac.yaml
          # Exclude RBAC source (templated) and cilium-demos (requires CRD schemas).
          git ls-files '*.yaml' '*.yml' \
            | grep -v '^security/rbac.yaml$' \
            | grep -v '^cilium-demos/' \
            | grep -v '^\.github/' \
            | grep -v '^kustomization.yaml$' \
            | xargs kubeconform \
                -kubernetes-version 1.30.0 \
                -strict \
                -summary \
                -ignore-missing-schemas \
                /tmp/rendered-rbac.yaml

      - name: Test advisory schema validation
        continue-on-error: true
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'kubeconform_schema_test.py'

      - name: Validate Cilium CRDs (advisory)
        continue-on-error: true
        run: |
          SCHEMA_LOCATION="https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          # Helm values are configuration inputs, not Kubernetes resources.
          git ls-files 'cilium-demos/**/*.yaml' ':(exclude,glob)cilium-demos/**/values/*.yaml' 2>/dev/null \
            | xargs --no-run-if-empty kubeconform \
                -kubernetes-version 1.30.0 \
                -summary \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location "$SCHEMA_LOCATION"
